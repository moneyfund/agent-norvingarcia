<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NICASA — Mapa de Propiedades en Nicaragua</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-mark">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="14" fill="#fff" opacity="0.15"/>
          <path d="M14 4C10 4 7 7.5 7 11.5C7 17 14 24 14 24C14 24 21 17 21 11.5C21 7.5 18 4 14 4Z" fill="white"/>
          <rect x="10" y="12" width="8" height="7" rx="1" fill="#1a6b40"/>
          <polygon points="14,8 9,13 19,13" fill="#1a6b40"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-name">NICASA</span>
        <span class="logo-tagline">propiedades en Nicaragua</span>
      </div>
    </div>

    <nav class="filtros">
      <button class="filtro active" data-tipo="todos">Todos</button>
      <button class="filtro" data-tipo="venta">Venta</button>
      <button class="filtro" data-tipo="alquiler">Alquiler</button>
    </nav>

    <div class="header-right">
      <span class="contador" id="contador">
        <span id="num">0</span> propiedades
      </span>
      <button class="btn-publicar" id="btnAbrir">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Publicar
      </button>
    </div>
  </header>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- BADGE flotante -->
  <div class="map-badge">🌿 Nicaragua</div>

  <!-- MODAL -->
  <div class="overlay" id="overlay">
    <div class="modal">

      <div class="modal-top">
        <div class="modal-title">
          <span class="modal-icon">🏡</span>
          <h2>Nueva publicación</h2>
        </div>
        <button class="btn-close" id="btnCerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="modal-body">

        <div class="field">
          <label>Tipo de operación</label>
          <div class="tipo-btns">
            <button class="tipo-btn active" id="btn-venta" onclick="setTipo('venta')">
              <span class="tipo-icon">🏷️</span> Venta
            </button>
            <button class="tipo-btn" id="btn-alquiler" onclick="setTipo('alquiler')">
              <span class="tipo-icon">🔑</span> Alquiler
            </button>
          </div>
        </div>

        <div class="field">
          <label>Ubicación en el mapa <span class="req">*</span></label>
          <div class="map-hint" id="map-hint">
            <span>📍</span> Toca el mapa para marcar la propiedad
          </div>
          <div id="mini-map"></div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Precio en USD <span class="req">*</span></label>
            <div class="input-wrap">
              <span class="input-prefix">$</span>
              <input type="number" id="precio" placeholder="85,000" />
            </div>
          </div>
          <div class="field">
            <label>Tipo de propiedad</label>
            <select id="tipo-prop">
              <option value="Casa">🏠 Casa</option>
              <option value="Apartamento">🏢 Apartamento</option>
              <option value="Terreno">🌿 Terreno</option>
              <option value="Local">🏪 Local comercial</option>
              <option value="Finca">🌾 Finca</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Descripción <span class="req">*</span></label>
          <textarea id="descripcion" placeholder="Casa 3 habitaciones, 2 baños, garaje, patio amplio..."></textarea>
        </div>

        <div class="field">
          <label>Teléfono / WhatsApp <span class="req">*</span></label>
          <div class="input-wrap">
            <span class="input-prefix">📱</span>
            <input type="tel" id="telefono" placeholder="+505 8888 0000" />
          </div>
        </div>

        <div class="field">
          <label>Foto de la propiedad</label>
          <label class="upload-area" for="foto" id="upload-label-wrap">
            <div class="upload-inner" id="upload-label">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>
              <span>Seleccionar foto</span>
            </div>
            <input type="file" id="foto" accept="image/*" />
          </label>
          <img id="preview-img" class="preview-img" />
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn-cancel" id="btnCancelar">Cancelar</button>
        <button class="btn-pub" onclick="publicar()">
          Publicar propiedad
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
